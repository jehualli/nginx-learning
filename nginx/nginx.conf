events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Load balancing ────────────────────────────────────────────────────────
    # Round-robin by default. nginx cycles through backend1 → backend2 → backend1 …
    upstream node_backends {
        server backend1:3000;
        server backend2:3000;

        # Uncomment to try weighted distribution (backend1 gets 3x the traffic):
        # server backend1:3000 weight=3;
        # server backend2:3000 weight=1;

        # Uncomment to try least-connections strategy instead of round-robin:
        # least_conn;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # 301 = permanent redirect; browser will cache this.
        # Use 302 while experimenting so browsers don't cache it.
        return 302 https://$host$request_uri;
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Static file serving ───────────────────────────────────────────────
        # nginx handles this itself — no backend involved.
        # Any request not matched by a more specific location falls here.
        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }

        # ── Reverse proxy + load balancing ────────────────────────────────────
        # Requests to /api/* are stripped of the /api prefix and forwarded
        # to whichever backend is next in the round-robin.
        location /api/ {
            proxy_pass         http://node_backends/;

            # Tell the backend who the real client is
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Health check endpoint (bypasses load balancer) ────────────────────
        # Hits backend1 directly so you can compare with /api/health
        location /health/b1 {
            proxy_pass http://backend1:3000/health;
        }
        location /health/b2 {
            proxy_pass http://backend2:3000/health;
        }
    }
}
