version: '3.8'

services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend1
      - backend2
    networks:
      - app-net

  backend1:
    build: ./backend1
    networks:
      - app-net

  backend2:
    build: ./backend2
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
